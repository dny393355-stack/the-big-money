<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE BIG MONEY | PREDICTOR</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --card: #121212; 
            --up: #00ffaa; 
            --down: #ff3b3b; 
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f9f295 0%, #e0aa3e 25%, #b8860b 50%, #e0aa3e 75%, #f9f295 100%);
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .luxury-header {
            text-align: center;
            padding: 20px 0 10px 0;
            background: linear-gradient(to bottom, #1a1a1a, var(--bg));
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
        }

        .premium-tag {
            font-size: 0.7rem;
            letter-spacing: 5px;
            color: var(--gold);
            text-transform: uppercase;
            margin-top: -5px;
            opacity: 0.8;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            flex-grow: 1;
        }

        .panel { 
            background: var(--card); 
            border: 1px solid #222; 
            border-radius: 16px; 
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .price-main { 
            font-size: 2.4rem; 
            font-weight: 900; 
            font-family: 'JetBrains Mono', monospace; 
            color: white;
        }

        .diff-val {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .target-label {
            font-size: 0.8rem;
            color: #888;
            background: #1a1a1a;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--gold);
        }

        #chart { 
            width: 100%;
            height: 250px; 
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
        }

        .momentum-container {
            margin: 20px 0;
        }

        .momentum-bar { 
            height: 12px; 
            background: #222; 
            border-radius: 6px; 
            overflow: hidden; 
            position: relative;
        }

        #momentum-fill { 
            height: 100%; 
            width: 50%; 
            background: var(--gold-gradient); 
            transition: 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .timer-box {
            text-align: center;
            margin: 10px 0;
        }

        .timer-val { 
            font-size: 3.5rem; 
            color: var(--gold); 
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
        }

        .final-btn { 
            display: block; 
            padding: 22px; 
            border-radius: 12px; 
            font-weight: 900; 
            font-size: 1.4rem; 
            border: none; 
            text-transform: uppercase; 
            cursor: pointer; 
            text-align: center; 
            text-decoration: none; 
            transition: 0.3s; 
            background: #222;
            color: #555;
        }

        .neon-pulse { 
            animation: pulse 1.5s infinite; 
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); 
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        .history-section { margin-top: 10px; overflow-x: auto; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .history-table td { padding: 12px 5px; border-bottom: 1px solid #222; text-align: center; }

        .terminal-box {
            background: #080808;
            border: 1px dashed var(--gold);
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #00ffaa;
            line-height: 1.5;
        }

        @media (min-width: 768px) {
            .container { flex-direction: row; max-width: 1200px; margin: 0 auto; }
            .panel { flex: 1; }
        }
    </style>
</head>
<body>

<div class="luxury-header">
    <h1 class="logo-text">The Big Money</h1>
    <div class="premium-tag">Beast Engine v3</div>
</div>

<div class="container">
    <div class="panel">
        <div class="price-row">
            <div>
                <div id="price" class="price-main">00,000</div>
                <div id="price-diff" class="diff-val">$0.00 (0.00%)</div>
            </div>
            <div id="target-display" class="target-label">TARGET: $0.00</div>
        </div>
        
        <div id="chart"></div>

        <div class="momentum-container">
            <div style="display:flex; justify-content:space-between; font-size:0.7rem; margin-bottom:5px; color:var(--gold);">
                <span>BEARISH</span>
                <span id="score-text">AI SCORE: 50</span>
                <span>BULLISH</span>
            </div>
            <div class="momentum-bar"><div id="momentum-fill"></div></div>
        </div>

        <div class="terminal-box" id="live-terminal">
            > INITIALIZING MULTI-TIMEFRAME ENGINE...<br>
            > SCANNING 1M & 5M DATA STREAMS...
        </div>

        <div class="history-section">
            <table class="history-table">
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <div class="panel" style="max-width: 350px; align-self: center; width: 100%; box-sizing: border-box;">
        <div class="timer-box">
            <div style="font-size: 0.8rem; color: #888; letter-spacing: 2px;">NEXT ROUND IN</div>
            <div id="timer" class="timer-val">00:00</div>
        </div>

        <div style="display: flex; justify-content: space-around; margin: 20px 0;">
            <div style="text-align:center">
                <div style="font-size:0.7rem; color:#888">YES CHANCE</div>
                <div id="chance-up" style="color:var(--up); font-size:1.5rem; font-weight:bold;">--%</div>
            </div>
            <div style="text-align:center">
                <div style="font-size:0.7rem; color:#888">NO CHANCE</div>
                <div id="chance-down" style="color:var(--down); font-size:1.5rem; font-weight:bold;">--%</div>
            </div>
        </div>

        <a id="main-btn" class="final-btn" target="_blank">ANALYZING...</a>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const chartContainer = document.getElementById('chart');
    
    const chart = LightweightCharts.createChart(chartContainer, {
        layout: { backgroundColor: 'transparent', textColor: '#888', fontSize: 10 },
        grid: { vertLines: { visible: false }, horzLines: { color: '#222' } },
        timeScale: { borderVisible: false },
        rightPriceScale: { borderVisible: false }
    });

    const candleSeries = chart.addCandlestickSeries({ 
        upColor: '#00ffaa', downColor: '#ff3b3b', borderVisible: false, wickUpColor: '#00ffaa', wickDownColor: '#ff3b3b' 
    });

    const priceLine = candleSeries.createPriceLine({
        price: 0, color: '#d4af37', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'TARGET',
    });

    socket.on('marketUpdate', (data) => {
        const price = data.indexPrice || data.price;
        const target = data.lastClose;
        const diff = (price - target).toFixed(2);
        const diffPct = ((diff / target) * 100).toFixed(3);
        
        document.getElementById('price').innerText = price.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('target-display').innerText = `TARGET: $${target.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        
        const diffEl = document.getElementById('price-diff');
        diffEl.innerText = `${diff >= 0 ? '+' : ''}${diff}$ (${diffPct}%)`;
        diffEl.style.color = diff >= 0 ? 'var(--up)' : 'var(--down)';

        priceLine.applyOptions({ price: target });

        candleSeries.update({
            time: Math.floor(Date.now() / 1000),
            open: data.candle.o, high: data.candle.h, low: data.candle.l, close: data.price
        });

        // עדכון טרמינל משופר (Multi-Timeframe) עם שורת ה-SIGNAL
        const terminal = document.getElementById('live-terminal');
        const rsi1m = data.rsi1m ? data.rsi1m.toFixed(1) : "SCANNING";
        const trendIcon = data.trend === 'BULLISH' ? '▲' : '▼';
        
        terminal.innerHTML = `
            > INDEX: $${price.toFixed(2)} | VOL: ${data.analysis.volume}<br>
            > SMC SIGNAL: <span style="color:var(--gold)">${data.smcSignal || "ANALYZING..."}</span><br>
            > 5M RSI: ${data.rsi.toFixed(1)} | 1M RSI: ${rsi1m}<br>
            > TREND: ${data.trend} ${trendIcon} | PWR: ${data.analysis.buyPressure}<br>
            > VOLATILITY: ${data.analysis.volatility} | FVG: ${data.fvg}<br>
            ${data.lockedDecision ? `> <span style="color:var(--gold)">DECISION LOCKED [${data.lockedDecision.time}]</span>` : '> SCANNING FOR MARKET WHALES...'}
        `;

        const score = data.finalScore;
        document.getElementById('score-text').innerText = `AI SCORE: ${score}`;
        document.getElementById('chance-up').innerText = score + '%';
        document.getElementById('chance-down').innerText = (100 - score) + '%';
        document.getElementById('momentum-fill').style.width = score + '%';

        const mins = Math.floor(data.secondsLeft / 60);
        const secs = data.secondsLeft % 60;
        document.getElementById('timer').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        const btn = document.getElementById('main-btn');
        const polyUrl = "https://polymarket.com/event/bitcoin-price-5-minute-intervals";

        if (data.lockedDecision) {
            const d = data.lockedDecision;
            btn.innerHTML = `🚀 ${d.action} (${d.score}%)`;
            btn.href = polyUrl;
            btn.style.background = d.score >= 50 ? 'var(--up)' : 'var(--down)';
            btn.style.color = d.score >= 50 ? 'black' : 'white';
            btn.className = 'final-btn neon-pulse';
        } else {
            btn.innerHTML = `⏳ SCANNING... (${data.secondsLeft}s)`;
            btn.href = polyUrl;
            btn.style.background = '#222';
            btn.style.color = '#555';
            btn.className = 'final-btn';
        }

        if (data.history) {
            document.getElementById('history-body').innerHTML = data.history.slice(0, 5).map(h => `
                <tr>
                    <td style="color:#666">${h.time}</td>
                    <td style="color:${h.prediction === 'YES' ? 'var(--up)' : 'var(--down)'}; font-weight:bold">${h.prediction}</td>
                    <td style="color:${h.success ? 'var(--up)' : 'var(--down)'}">${h.success ? '🎯 WIN' : '❌ LOSS'}</td>
                </tr>
            `).join('');
        }
    });

    window.addEventListener('resize', () => chart.resize(chartContainer.clientWidth, chartContainer.clientHeight));
</script>
</body>
</html>
